name: Finalize Faz 1 live fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/faz1-finalize-live-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch latest-month behavior and cache busting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')

          old = '  let applyingRemoteState = false;'
          new = '  let applyingRemoteState = false;\n  let monthWasUserSelected = false;'
          if old not in s:
              raise SystemExit('month flag anchor missing')
          s = s.replace(old, new, 1)

          old = 'document.addEventListener("change", (event) => { const filter = event.target.closest("[data-filter]"); if (!filter) return; const key = filter.dataset.filter; if (key === "month") state.month = filter.value; if (key === "category") state.category = filter.value; if (key === "brand") state.brand = filter.value; if (key === "sort") state.sort = filter.value; if (key === "startDate") state.startDate = filter.value; if (key === "endDate") state.endDate = filter.value; if ((key === "startDate" || key === "endDate") && filter.value) state.month = "all"; render(); });'
          new = 'document.addEventListener("change", (event) => { const filter = event.target.closest("[data-filter]"); if (!filter) return; const key = filter.dataset.filter; if (key === "month") { state.month = filter.value; monthWasUserSelected = true; } if (key === "category") state.category = filter.value; if (key === "brand") state.brand = filter.value; if (key === "sort") state.sort = filter.value; if (key === "startDate") state.startDate = filter.value; if (key === "endDate") state.endDate = filter.value; if ((key === "startDate" || key === "endDate") && filter.value) { state.month = "all"; monthWasUserSelected = true; } render(); });'
          if old not in s:
              raise SystemExit('change listener anchor missing')
          s = s.replace(old, new, 1)

          old = '''  window.applyFAZ1CloudState = (state) => {\n    if (!state || typeof state !== "object") return;\n    applyingRemoteState = true;\n    const values = {\n      faz1_overrides: state.overrides && typeof state.overrides === "object" ? state.overrides : {},\n      faz1_deleted: Array.isArray(state.deleted) ? state.deleted : [],\n      faz1_custom: Array.isArray(state.custom) ? state.custom : [],\n    };\n    Object.entries(values).forEach(([key, value]) => {\n      memoryStorage.set(key, value);\n      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* in-memory fallback */ }\n    });\n    applyingRemoteState = false;\n    render();\n  };'''
          new = '''  window.applyFAZ1CloudState = (remoteState) => {\n    if (!remoteState || typeof remoteState !== "object") return;\n    applyingRemoteState = true;\n    const values = {\n      faz1_overrides: remoteState.overrides && typeof remoteState.overrides === "object" ? remoteState.overrides : {},\n      faz1_deleted: Array.isArray(remoteState.deleted) ? remoteState.deleted : [],\n      faz1_custom: Array.isArray(remoteState.custom) ? remoteState.custom : [],\n    };\n    Object.entries(values).forEach(([key, value]) => {\n      memoryStorage.set(key, value);\n      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* in-memory fallback */ }\n    });\n    applyingRemoteState = false;\n    if (!monthWasUserSelected) {\n      const available = monthOrder.filter((month) => allSales().some((item) => item.month === month));\n      state.month = available[available.length - 1] || state.month;\n    }\n    render();\n  };'''
          if old not in s:
              raise SystemExit('cloud state anchor missing')
          s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          replacements = {
              'href="style.css"': 'href="style.css?v=20260817-2"',
              'src="data.js"': 'src="data.js?v=20260817-2"',
              'src="app.js"': 'src="app.js?v=20260817-2"',
              'src="august-invoice-import.js"': 'src="august-invoice-import.js?v=20260817-2"',
              'src="firebase.js"': 'src="firebase.js?v=20260817-2"',
          }
          for a, b in replacements.items():
              if a in h:
                  h = h.replace(a, b, 1)
          index.write_text(h, encoding='utf-8')
          PY
          node --check app.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "fix: open latest synced month and bust stale assets"
          git push origin HEAD:main
