name: Check Firebase deploy credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-credential-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          FIREBASE_TOKEN_SET: ${{ secrets.FIREBASE_TOKEN != '' }}
          FIREBASE_CI_TOKEN_SET: ${{ secrets.FIREBASE_CI_TOKEN != '' }}
          FIREBASE_SERVICE_ACCOUNT_SET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          FIREBASE_SERVICE_ACCOUNT_METIN_FINANS_SET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_METIN_FINANS != '' }}
          FIREBASE_SERVICE_ACCOUNT_METIN_FINANS_FAZ1_SET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_METIN_FINANS_FAZ1 != '' }}
          GCP_SA_KEY_SET: ${{ secrets.GCP_SA_KEY != '' }}
          GOOGLE_CREDENTIALS_SET: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON_SET: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}
          GCLOUD_SERVICE_KEY_SET: ${{ secrets.GCLOUD_SERVICE_KEY != '' }}
        run: |
          echo "FIREBASE_TOKEN=$FIREBASE_TOKEN_SET"
          echo "FIREBASE_CI_TOKEN=$FIREBASE_CI_TOKEN_SET"
          echo "FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT_SET"
          echo "FIREBASE_SERVICE_ACCOUNT_METIN_FINANS=$FIREBASE_SERVICE_ACCOUNT_METIN_FINANS_SET"
          echo "FIREBASE_SERVICE_ACCOUNT_METIN_FINANS_FAZ1=$FIREBASE_SERVICE_ACCOUNT_METIN_FINANS_FAZ1_SET"
          echo "GCP_SA_KEY=$GCP_SA_KEY_SET"
          echo "GOOGLE_CREDENTIALS=$GOOGLE_CREDENTIALS_SET"
          echo "GOOGLE_APPLICATION_CREDENTIALS_JSON=$GOOGLE_APPLICATION_CREDENTIALS_JSON_SET"
          echo "GCLOUD_SERVICE_KEY=$GCLOUD_SERVICE_KEY_SET"
